version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    # Automatically group minor and patch updates
    groups:
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'patch'
        # astro patches (5.18.x) don't clear the high-sev SSRF advisory (fix is in
        # astro 6, a deferred migration) → they keep Dependency Review red and would
        # block the whole group. Keep astro out so routine prod patches still flow;
        # astro then bumps solo and gets closed like #252 until v6 is scheduled.
        exclude-patterns:
          - 'astro'
    # Ignore specific dependencies if needed
    ignore:
      # Major bumps blocked indefinitely on peer-dep ERESOLVE — re-enable when ecosystem catches up
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint'
        update-types: ['version-update:semver-major']
      # typescript 7 is the native-port compiler; vue-tsc + typescript-eslint +
      # @microsoft/eslint-plugin-sdl must ship TS7-compatible releases first.
      # PR #282 (5.9.3 -> 7.0.2) failed CI outright on 2026-07-21.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Major bumps needing a focused migration with QA — re-enable when scheduled
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/mdx'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro-seo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro-og-canvas'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pdfjs-dist'
        update-types: ['version-update:semver-major']
      - dependency-name: 'canvaskit-wasm'
        update-types: ['version-update:semver-major']

    # Security updates configuration
    versioning-strategy: increase

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    labels:
      - 'github-actions'
      - 'dependencies'
    commit-message:
      prefix: 'chore(ci)'
