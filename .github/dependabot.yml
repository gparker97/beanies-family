version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    # Automatically group minor and patch updates
    groups:
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'patch'
    # Ignore specific dependencies if needed
    ignore:
      # Major bumps blocked indefinitely on peer-dep ERESOLVE — re-enable when ecosystem catches up
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint'
        update-types: ['version-update:semver-major']
      # Major bumps needing a focused migration with QA — re-enable when scheduled
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/mdx'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro-seo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'astro-og-canvas'
        update-types: ['version-update:semver-major']
      - dependency-name: 'canvaskit-wasm'
        update-types: ['version-update:semver-major']

    # Security updates configuration
    versioning-strategy: increase

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    labels:
      - 'github-actions'
      - 'dependencies'
    commit-message:
      prefix: 'chore(ci)'
