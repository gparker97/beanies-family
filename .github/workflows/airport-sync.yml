name: Airport List Sync

on:
  schedule:
    # 1st of each month at 04:00 UTC (offset from translation/security jobs).
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: airport-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  sync:
    name: Refresh airport list
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Need prettier (devDep) so the script's post-format pass works.
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run airport update
        run: npm run update-airports

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet src/constants/airports.ts; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No airport changes — list is up to date."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Airport changes detected:"
            git diff --stat src/constants/airports.ts
          fi

      - name: Open pull request
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/airport-sync-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add src/constants/airports.ts
          git commit -m "chore(airports): auto-update airport list from OurAirports"
          git push -u origin "$BRANCH"

          # Counts for the PR body — handy at-a-glance.
          ADDED=$(git diff main -- src/constants/airports.ts | grep -c '^+  { code:' || true)
          REMOVED=$(git diff main -- src/constants/airports.ts | grep -c '^-  { code:' || true)

          gh pr create \
            --title "chore(airports): monthly auto-update from OurAirports" \
            --body "$(cat <<EOF
          ## Summary
          - Pulled fresh airport data from [OurAirports](https://ourairports.com/data/) (public domain)
          - Filter: \`scheduled_service=yes\` AND non-empty IATA code
          - Lines added: ${ADDED} • Lines removed: ${REMOVED}

          ## Review
          - Skim the diff for anything weird (e.g. a major airport disappearing or an IATA reassignment)
          - If the upstream CSV format changed, the script may need a tweak — see \`scripts/updateAirports.mjs\`

          🤖 Generated by \`.github/workflows/airport-sync.yml\`
          EOF
          )" \
            --label "automation"
