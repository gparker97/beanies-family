name: Deploy beanies PROD

on:
  workflow_dispatch:
    inputs:
      skip_gate:
        description: 'Skip CI/Security gate (for config-only changes verified locally)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-southeast-1

jobs:
  gate:
    name: Verify CI & Security passed
    if: ${{ !inputs.skip_gate }}
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Main Branch CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.sha }}
          WORKFLOW="main-ci.yml"
          TIMEOUT=600  # 10 minutes
          INTERVAL=15
          ELAPSED=0

          echo "Waiting for Main Branch CI to pass for commit $SHA..."

          # Require a CI run to exist — fail immediately if none found
          result=$(gh run list --repo ${{ github.repository }} --workflow=$WORKFLOW --branch=main --commit=$SHA --limit=1 --json conclusion,status -q '.[0]')
          if [ -z "$result" ] || [ "$result" = "null" ]; then
            echo "::error::No Main Branch CI run found for commit $SHA. CI must run before deploying."
            exit 1
          fi

          while [ $ELAPSED -lt $TIMEOUT ]; do
            result=$(gh run list --repo ${{ github.repository }} --workflow=$WORKFLOW --branch=main --commit=$SHA --limit=1 --json conclusion,status -q '.[0]')

            status=$(echo "$result" | jq -r '.status')
            conclusion=$(echo "$result" | jq -r '.conclusion')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Main Branch CI: passed"
                break
              else
                echo "::error::Main Branch CI failed for commit $SHA (conclusion: $conclusion)"
                exit 1
              fi
            fi

            echo "Main Branch CI still running (status: $status), waiting ${INTERVAL}s... (${ELAPSED}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "::error::Timed out waiting for Main Branch CI after ${TIMEOUT}s"
            exit 1
          fi

      - name: Wait for Security Scanning to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.sha }}
          WORKFLOW="security.yml"
          TIMEOUT=600  # 10 minutes
          INTERVAL=15
          ELAPSED=0

          echo "Waiting for Security Scanning to pass for commit $SHA..."

          # Require a security run to exist — fail immediately if none found
          result=$(gh run list --repo ${{ github.repository }} --workflow=$WORKFLOW --branch=main --commit=$SHA --limit=1 --json conclusion,status -q '.[0]')
          if [ -z "$result" ] || [ "$result" = "null" ]; then
            echo "::error::No Security Scanning run found for commit $SHA. Security checks must run before deploying."
            exit 1
          fi

          while [ $ELAPSED -lt $TIMEOUT ]; do
            result=$(gh run list --repo ${{ github.repository }} --workflow=$WORKFLOW --branch=main --commit=$SHA --limit=1 --json conclusion,status -q '.[0]')

            status=$(echo "$result" | jq -r '.status')
            conclusion=$(echo "$result" | jq -r '.conclusion')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Security Scanning: passed"
                break
              else
                echo "::error::Security Scanning failed for commit $SHA (conclusion: $conclusion)"
                exit 1
              fi
            fi

            echo "Security Scanning still running (status: $status), waiting ${INTERVAL}s... (${ELAPSED}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "::error::Timed out waiting for Security Scanning after ${TIMEOUT}s"
            exit 1
          fi

  build:
    name: Build for production
    needs: gate
    if: ${{ always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update translations
        run: node scripts/updateTranslations.mjs --all

      - name: Build for production
        run: npm run build
        env:
          VITE_REGISTRY_API_URL: ${{ secrets.REGISTRY_API_URL }}
          VITE_REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VITE_GOOGLE_PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }}
          # Explicit on/off switch for the invite gate (repo VARIABLE, not a secret, so
          # its value is visible/editable in the UI). Only "true" arms the gate; the
          # hashes secret below stays populated but inert while this is off.
          VITE_INVITE_GATE: ${{ vars.INVITE_GATE }}
          VITE_INVITE_BEAN_HASHES: ${{ secrets.INVITE_BEAN_HASHES }}
          VITE_INVITE_WEBHOOK_URL: ${{ secrets.INVITE_WEBHOOK_URL }}
          VITE_CONTACT_WEBHOOK_URL: ${{ secrets.CONTACT_WEBHOOK_URL }}
          VITE_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Error reporter — fires automatic Slack messages to #beanies-errors
          # whenever any error toast / Vue render error / unhandled rejection
          # is caught. Webhook URL is a repository VARIABLE (not a secret) per
          # the rule in tasks/lessons.md — it sits in the client bundle anyway
          # and being a variable makes it auditable + rotatable from the UI.
          VITE_BEANIES_ERROR_WEBHOOK_URL: ${{ vars.BEANIES_ERROR_WEBHOOK_URL }}
          # #45: in-app feedback / NPS → private #beanies-feedback channel. A repo
          # VARIABLE (not a secret) — it ships in the client bundle anyway (VITE_),
          # and a variable stays auditable + rotatable from the UI (same rule as the
          # error webhook above). Empty → the feature is inert (submit warns to console).
          VITE_FEEDBACK_WEBHOOK_URL: ${{ vars.FEEDBACK_WEBHOOK_URL }}
          # Diagnostic-logging firehose (ADR-027). Ingest URL is a repository
          # VARIABLE (Terraform `telemetry_ingest_url` output) — non-sensitive,
          # sits in the client bundle anyway. The soft x-api-key is a SECRET
          # (mirrors VITE_REGISTRY_API_KEY) to deter casual abuse of POST /logs.
          VITE_BEANIES_LOG_INGEST_URL: ${{ vars.BEANIES_LOG_INGEST_URL }}
          VITE_BEANIES_LOG_INGEST_API_KEY: ${{ secrets.BEANIES_LOG_INGEST_API_KEY }}
          # AI document-extraction proxy (#133, ADR-030). Endpoint is a repository
          # VARIABLE (Terraform `ai_extract_url` output) — sits in the bundle anyway.
          # The soft x-api-key is a SECRET (mirrors the ingest key) to deter casual
          # abuse of the billable POST /ai-extract route. Both unset = managed tier
          # cleanly reports "not available yet" (no broken UI).
          VITE_AI_EXTRACT_URL: ${{ vars.AI_EXTRACT_URL }}
          VITE_AI_EXTRACT_API_KEY: ${{ secrets.AI_EXTRACT_API_KEY }}
          # Recipe content fetcher (#72). On EVERY lane: the parity test only enforces the
          # two release lanes, so the debug lanes must be kept in step by hand or a native
          # debug build silently loses the ability to capture a recipe from a link.
          VITE_CONTENT_FETCH_URL: ${{ vars.CONTENT_FETCH_URL }}
          VITE_CONTENT_FETCH_API_KEY: ${{ secrets.CONTENT_FETCH_API_KEY }}
          # Plausible site script ID for app.beanies.family (the Vue PWA).
          # `src/services/analytics/plausible.ts` is gated on this var so a
          # vanilla self-host stays fully offline by default — only the
          # official deploy (this workflow) opts the app into analytics.
          # The value is NOT a secret: it appears verbatim in the
          # `https://plausible.io/js/pa-<id>.js` <script src> on every page.
          # The marketing site (beanies.family) has its own ID hardcoded in
          # web/src/layouts/BaseLayout.astro — that's a separate Plausible site.
          VITE_PLAUSIBLE_DOMAIN: jvjpzIr6FM9tDKaS1gZaK
          # Build SHA — every error report includes this so we can correlate
          # bugs to specific deploys. Falls back to 'dev' for local builds.
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          # Include dotfiles so dist/.well-known/ (assetlinks.json for native
          # WebAuthn association + apple-app-site-association) survives the
          # artifact round-trip and reaches S3. upload-artifact strips hidden
          # files by default; aws s3 sync itself preserves them. Same fix as
          # deploy-web.yml for the apex. See ADR-029.
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to PROD
    needs: [gate, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        # Two-step deploy to close the "post-deploy chunk-load loop" window.
        #
        # Step 1: sync everything WITHOUT `--delete`. Old hashed chunks from
        # the previous deploy survive in S3 for the CloudFront cache-stale
        # window (~1-15min between this deploy completing and CDN-edge
        # invalidation propagating). Without this, any user whose CDN edge
        # still has the OLD `index.html` cached gets a 404 on chunk URLs
        # this deploy rotated → the "Cannot destructure property X from
        # null or undefined value" reload loop (greg's iPhone 14, May 2026).
        # Storage cost is negligible (a few MB per deploy; `/assets/*` are
        # immutable so the CDN long-caches them anyway). A lifecycle rule
        # can prune anything older than N days as a follow-up.
        #
        # Step 2: overwrite `index.html` with `Cache-Control: no-cache` so
        # CloudFront always revalidates with S3 instead of holding the stale
        # copy for up to `default_ttl=86400` (24h, per the app subdomain's
        # Terraform — `infrastructure/modules/app-subdomain/main.tf`).
        # Combined with step 1, this means: even when CDN serves a stale
        # `index.html`, the chunks it references still exist; AND the stale
        # window shrinks to seconds, not hours.
        run: |
          aws s3 sync dist/ s3://${{ vars.APP_S3_BUCKET }}
          aws s3 cp dist/index.html s3://${{ vars.APP_S3_BUCKET }}/index.html \
            --cache-control "no-cache, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.APP_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
