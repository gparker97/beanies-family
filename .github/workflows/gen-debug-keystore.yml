name: One-shot — generate stable debug keystore

# One-time helper (ADR-029): generate a STABLE debug keystore so the debug APK
# has a fixed signing fingerprint that App Links can verify (Google sign-in
# round-trip). Debug keystores are NOT sensitive (standard public creds), so the
# fingerprint goes in assetlinks.json and the keystore is committed. Run once via
# the Actions tab / `gh workflow run`, then this workflow is deleted.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore (standard debug creds)
        run: |
          keytool -genkeypair -v \
            -keystore beanies-debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=beanies.family debug, OU=dev, O=beanies, C=SG"

      - name: Print SHA-256 fingerprint (copy into assetlinks.json)
        run: |
          echo "### Debug keystore SHA-256 (for assetlinks.json):" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore beanies-debug.keystore -alias androiddebugkey -storepass android \
            | grep "SHA256:" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore for retrieval
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: beanies-debug.keystore
          if-no-files-found: error
