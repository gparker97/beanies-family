name: Public Holiday Dataset Sync

on:
  schedule:
    # 1st of each month at 05:00 UTC (offset from airport/translation/security jobs).
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: holiday-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  sync:
    name: Refresh public-holiday dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Needs `date-holidays` (devDep) for the generator + prettier for the
        # countries.ts post-format pass.
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate holiday dataset
        run: npm run generate:holidays

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- public/holidays src/constants/countries.ts; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No holiday changes — dataset is up to date."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Holiday dataset changes detected:"
            git diff --stat -- public/holidays src/constants/countries.ts
          fi

      - name: Open pull request
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/holiday-sync-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add public/holidays src/constants/countries.ts
          git commit -m "chore(holidays): auto-update public-holiday dataset from date-holidays"
          git push -u origin "$BRANCH"

          FILES=$(git diff --name-only main -- public/holidays src/constants/countries.ts | wc -l | tr -d ' ')

          gh pr create \
            --title "chore(holidays): monthly auto-update of the public-holiday dataset" \
            --body "$(cat <<EOF
          ## Summary
          - Regenerated \`public/holidays/<CC>.json\` + \`src/constants/countries.ts\` from \`date-holidays\` (devDependency)
          - Scope: national \`type === 'public'\` holidays, rolling window [currentYear-1 .. currentYear+3]
          - Files changed: ${FILES}

          ## Review
          - Skim the diff for anything weird (a country's holidays disappearing, a name changing oddly, a date shifting)
          - The year window rolls forward each run — most changes will be next-year entries appearing and old-year entries dropping out
          - If \`date-holidays\` was bumped (Dependabot), this PR also captures the resulting data changes — review them alongside the bump

          🤖 Generated by \`.github/workflows/holiday-sync.yml\`
          EOF
          )" \
            --label "automation"
