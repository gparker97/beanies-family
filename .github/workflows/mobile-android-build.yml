name: Mobile — Android debug APK

# Spike (ADR-029): build an installable, UNSIGNED debug APK for the Capacitor
# Android wrapper so we can validate on a real device that the app loads and the
# Automerge WASM initializes in the WebView. Public repo → free runners; a debug
# APK needs no signing, so this needs no secrets and no Apple/Google account.
#
# Builds on pushes to main (the Capacitor work merged from spike/capacitor-mobile)
# + manual dispatch. Docs-only pushes are skipped. This is a free, unsigned
# debug-APK lane for on-device dev testing; the signed Play release lives in
# mobile-android-release.yml (manual-only).

on:
  push:
    branches: ['main']
    # Docs-only changes don't change the build — skip them so doc edits don't rebuild.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK to a rolling prerelease

jobs:
  android-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # Enable Google Drive + OAuth in the debug APK so native Google
          # sign-in is testable on-device (ADR-029). Same client-side values the
          # prod web bundle already ships — no new exposure. The token exchange
          # uses the registry/OAuth-proxy Lambda (api.beanies.family).
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_REGISTRY_API_URL: ${{ secrets.REGISTRY_API_URL }}
          VITE_REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
          # The official-build guard in vite.config.ts requires BOTH webhooks
          # whenever VITE_BUILD_SHA is set (below). Without this Slack one the
          # build hard-fails ("Official build is missing required env"), which is
          # what was breaking every iOS/Android CI build.
          VITE_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Surface any native OAuth/runtime errors during on-device testing.
          VITE_BEANIES_ERROR_WEBHOOK_URL: ${{ vars.BEANIES_ERROR_WEBHOOK_URL }}
          # #45 in-app feedback/NPS. VARIABLE, not a secret (it ships in the
          # client bundle anyway). MUST be here as well as in deploy.yml: the
          # native app has its own build step, and omitting it made every
          # app-submitted feedback a silent no-op from 2026-07-09 to 2026-08-10.
          VITE_FEEDBACK_WEBHOOK_URL: ${{ vars.FEEDBACK_WEBHOOK_URL }}
          VITE_BEANIES_LOG_INGEST_URL: ${{ vars.BEANIES_LOG_INGEST_URL }}
          VITE_BEANIES_LOG_INGEST_API_KEY: ${{ secrets.BEANIES_LOG_INGEST_API_KEY }}
          # Stamp the build so the diagnostic firehose (build_sha) identifies
          # exactly which APK is running on-device — otherwise every debug build
          # reports "dev" and we can't tell a stale install from a fresh one.
          VITE_BUILD_SHA: ${{ github.sha }}
          # Managed AI document-reader endpoint (Magic beans). Without these the
          # managed tier degrades to `not_available` ("reading photos isn't set
          # up yet"), so on-device testing of the AI readers fails on the debug
          # APK even though the camera opens. Same values the prod web bundle +
          # the release lanes already ship.
          VITE_AI_EXTRACT_URL: ${{ vars.AI_EXTRACT_URL }}
          VITE_AI_EXTRACT_API_KEY: ${{ secrets.AI_EXTRACT_API_KEY }}

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build debug APK
        # Unique, monotonically increasing versionCode per build so a new APK
        # always installs cleanly over the previous one. Without this every
        # debug build is versionCode 1, and Android may refuse to update —
        # leaving a stale APK on the device (the cause of "nothing changed"
        # across rebuilds). versionName carries the short SHA for at-a-glance ID.
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.0.0-debug.${{ github.run_number }}+${{ github.sha }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: beanies-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the raw .apk to a rolling prerelease so it installs in one tap
      # from a phone (release assets download directly, no zip to extract — the
      # workflow artifact above stays as a desktop/CLI fallback).
      - name: Publish APK to rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk beanies-family-android-debug.apk
          gh release delete spike-android-latest --yes --cleanup-tag || true
          gh release create spike-android-latest beanies-family-android-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "beanies.family — Android spike build (debug, unsigned)" \
            --notes "Latest Capacitor Android debug APK from \`spike/capacitor-mobile\` (ADR-029). Commit ${GITHUB_SHA}. Debug/unsigned — on-device testing only, not for distribution. Tap \`beanies-family-android-debug.apk\` below to install on Android (allow 'install from unknown sources')."
