name: Mobile — Android release (Play)

# Manual-only (ADR-029 A6). Builds a SIGNED release AAB and (optionally) uploads
# it to a Google Play track. It has NO push/PR trigger, so it can never fail a
# push or block a build — it stays dormant until you trigger it AND the signing
# secrets exist:
#   Always required:            ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#                               ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Required only when uploading: PLAY_SERVICE_ACCOUNT_JSON
# Set `upload_to_play: false` to skip the Play push and instead download the
# signed AAB as a workflow artifact — this is the path for a brand-new app's
# FIRST upload, which is done manually through the Play Console wizard (no service
# account needed yet; the manual upload is also what unlocks the Play App Signing
# SHA-256 for the two assetlinks.json files — runbook Tranche 3b).
# The preflight step below fails fast with instructions if a required secret is
# missing, so a premature run gives a clear message instead of an obscure Gradle
# error. Gradle release signing is conditional on ANDROID_KEYSTORE_PATH
# (android/app/build.gradle), so the debug lane is completely unaffected.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (ignored when upload_to_play is off)'
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      upload_to_play:
        description: 'Upload to Play (off = build a downloadable signed AAB artifact only)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release-aab:
    name: Build + upload signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preflight — require signing + Play secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD: ${{ inputs.upload_to_play }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          if [ "$UPLOAD" = "true" ] && [ -z "$SA" ]; then
            missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Release lane not configured — missing repo secrets:$missing. Set up the release keystore (always) + a Google Play service account (only for upload_to_play=true) first (see ADR-029 A6 and web/public/.well-known/README.md), then re-run."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Derive store marketing version
        # Store versionName tracks APP_VERSION (src/constants/appVersion.ts),
        # R-suffix stripped for a store-safe value (e.g. 0.9.4R1 → 0.9.4). The
        # helper prints ONLY the bare version to stdout and exits non-zero on a
        # malformed APP_VERSION; `set -euo pipefail` then fails the job rather
        # than stamping an empty version. versionCode stays the monotonic run number.
        run: |
          set -euo pipefail
          echo "STORE_VERSION=$(node scripts/derive-store-version.mjs)" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build
        env:
          # Full client-side config for the SHIPPED release bundle — mirrors
          # deploy.yml's prod web build so the Play Store app has Google sign-in,
          # the registry/OAuth proxy, AI document extraction, and operational
          # alerting all wired. Previously this step set NO env, so a release
          # would have shipped an unconfigured bundle (no sign-in, no AI, no
          # alerting). The official-build guard in vite.config.ts also requires
          # both webhooks once VITE_BUILD_SHA is set.
          VITE_REGISTRY_API_URL: ${{ secrets.REGISTRY_API_URL }}
          VITE_REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VITE_GOOGLE_PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }}
          # Explicit on/off switch for the invite gate (repo VARIABLE, not a secret, so
          # its value is visible/editable in the UI). Only "true" arms the gate; the
          # hashes secret below stays populated but inert while this is off.
          VITE_INVITE_GATE: ${{ vars.INVITE_GATE }}
          VITE_INVITE_BEAN_HASHES: ${{ secrets.INVITE_BEAN_HASHES }}
          VITE_INVITE_WEBHOOK_URL: ${{ secrets.INVITE_WEBHOOK_URL }}
          # REVIEW-DEMO: (TEMPORARY) store-review demo bypass — a code-gated demo
          # family that needs no Google sign-in, because reviewers cannot get past
          # Google's risk-based verification challenges. Deliberately set ONLY on the
          # two mobile RELEASE lanes: never on deploy.yml (a negative assertion in
          # workflowEnvParity.test.ts enforces that the web bundle never carries it)
          # and never on the debug lanes (dev builds use .env.local).
          #
          # All three are repo VARIABLES, so their values are visible and editable in
          # the UI. The hash is deliberately NOT a secret: it is a one-way digest that
          # ships in the client bundle regardless, so the repo setting is not where the
          # exposure lives — the PLAINTEXT code is the thing that stays out of the repo.
          # EXPIRES is parsed as UTC MIDNIGHT, i.e. the first DEAD instant — set it to the day
          # AFTER the last day the demo should work. Unset = permanently disarmed.
          # Remove all three when demo mode is retired (see
          # docs/runbooks/native-store-submission.md).
          VITE_REVIEW_DEMO: ${{ vars.REVIEW_DEMO }}
          VITE_REVIEW_DEMO_CODE_HASH: ${{ vars.REVIEW_DEMO_CODE_HASH }}
          VITE_REVIEW_DEMO_EXPIRES: ${{ vars.REVIEW_DEMO_EXPIRES }}
          VITE_CONTACT_WEBHOOK_URL: ${{ secrets.CONTACT_WEBHOOK_URL }}
          VITE_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VITE_BEANIES_ERROR_WEBHOOK_URL: ${{ vars.BEANIES_ERROR_WEBHOOK_URL }}
          # #45 in-app feedback/NPS. VARIABLE, not a secret (it ships in the
          # client bundle anyway). MUST be here as well as in deploy.yml: the
          # native app has its own build step, and omitting it made every
          # app-submitted feedback a silent no-op from 2026-07-09 to 2026-08-10.
          VITE_FEEDBACK_WEBHOOK_URL: ${{ vars.FEEDBACK_WEBHOOK_URL }}
          VITE_BEANIES_LOG_INGEST_URL: ${{ vars.BEANIES_LOG_INGEST_URL }}
          VITE_BEANIES_LOG_INGEST_API_KEY: ${{ secrets.BEANIES_LOG_INGEST_API_KEY }}
          VITE_AI_EXTRACT_URL: ${{ vars.AI_EXTRACT_URL }}
          VITE_AI_EXTRACT_API_KEY: ${{ secrets.AI_EXTRACT_API_KEY }}
          # Recipe content fetcher (#72). On EVERY lane: the parity test only enforces the
          # two release lanes, so the debug lanes must be kept in step by hand or a native
          # debug build silently loses the ability to capture a recipe from a link.
          VITE_CONTENT_FETCH_URL: ${{ vars.CONTENT_FETCH_URL }}
          VITE_CONTENT_FETCH_API_KEY: ${{ secrets.CONTENT_FETCH_API_KEY }}
          VITE_PLAUSIBLE_DOMAIN: jvjpzIr6FM9tDKaS1gZaK
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Monotonic versionCode from the run number; versionName tracks
          # APP_VERSION (derived above, R-suffix stripped).
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ env.STORE_VERSION }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload signed AAB as workflow artifact
        # Always retained so a build-only run (upload_to_play=false) yields a
        # downloadable AAB for a manual Play Console upload, and an upload run
        # still keeps a copy of exactly what was shipped.
        uses: actions/upload-artifact@v7
        with:
          name: beanies-family-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play (${{ inputs.track }})
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: family.beanies.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # `tracks` (plural) is the current input; `track` (singular) is deprecated.
          # A single track name is accepted here.
          tracks: ${{ inputs.track }}
          # status: completed + changesNotSentForReview: false → the release is
          # published to the track AND auto-submitted for Google review, so there is
          # no manual "Submit for review" click-through in Play Console. (Uploading
          # straight to the target track this way also avoids the draft that a manual
          # internal→closed promotion creates.)
          # Caveat: until this app has had its FIRST production release approved, the
          # Play API can reject auto-submit and demand a one-time manual review
          # submission — if a run fails with that error, set this to `true` for that
          # run, submit once in the console, then flip it back.
          status: completed
          changesNotSentForReview: false
