name: Mobile — iOS release (TestFlight / App Store)

# iOS release lane (ADR-029): build a signed Release IPA and ship it to the
# destination chosen by the `destination` input — TestFlight (internal testers) or
# the App Store (submit for review, with a post-approval release mode). Manual-dispatch
# ONLY, so it never auto-runs on a push. The App Store path became usable once Apple
# approved the first version (2026-08-21); see docs/plans/2026-08-21-ios-appstore-submit-lane.md.
#
# Before the first run, add these in Settings → Secrets and variables → Actions.
# The three identifiers are non-sensitive (useless without the .p8 private key),
# so they live as VARIABLES; only the private key is a SECRET.
#   [Variable] APP_STORE_CONNECT_API_KEY_ID    — the key's Key ID (App Store Connect → Users and Access → Integrations → App Store Connect API)
#   [Variable] APP_STORE_CONNECT_API_ISSUER_ID — the Issuer ID on that same page
#   [Variable] APPLE_TEAM_ID                   — the 10-char Team ID (Apple Developer → Membership)
#   [Secret]   APP_STORE_CONNECT_API_KEY_P8    — base64 of the downloaded AuthKey_XXXX.p8
#                                                (Linux/WSL: `base64 -w0 AuthKey_XXXX.p8`; macOS: `base64 -i AuthKey_XXXX.p8 | pbcopy`)
# The API key needs the "App Manager" (or Admin) role so cloud-managed signing
# (`-allowProvisioningUpdates`) can create the distribution profile. The VITE_*
# build secrets are already set (shared with the web + Android lanes).
#
# Mirrors mobile-android-release.yml; the web build env is identical so the iOS
# bundle ships the same configured app.

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Where to ship the signed build'
        type: choice
        default: testflight
        # testflight        → upload to TestFlight (internal testers), no review.
        # appstore-manual   → submit to App Store review; hold for a manual Release click after approval.
        # appstore-automatic→ submit to App Store review; release automatically once approved.
        # appstore-phased   → submit to App Store review; 7-day phased rollout after approval.
        options: [testflight, appstore-manual, appstore-automatic, appstore-phased]
      whats_new:
        description: "App Store 'What's New' note (REQUIRED for appstore-* — Apple rejects an update without one; ignored for testflight)"
        type: string
        default: ''
      promotional_text:
        description: 'App Store promotional text (OPTIONAL, ≤170 chars; no review needed; leave blank to keep the current value; ignored for testflight)'
        type: string
        default: ''
      skip_entitlement_check:
        description: 'Ship even though the build cannot share (app-group entitlement missing). ESCAPE HATCH for an unrelated urgent release — sharing and Universal Links will NOT work in it.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios-testflight:
    name: Build + upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive store marketing version
        # MARKETING_VERSION (CFBundleShortVersionString) tracks APP_VERSION
        # (src/constants/appVersion.ts), R-suffix stripped so it's a valid ≤3-part
        # numeric (e.g. 0.9.4R1 → 0.9.4). Helper prints only the bare version and
        # exits non-zero on malformed input; `set -euo pipefail` fails the job
        # instead of stamping an empty version. CFBundleVersion stays the run number.
        run: |
          set -euo pipefail
          echo "STORE_VERSION=$(node scripts/derive-store-version.mjs)" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build
        env:
          # Full client-side config for the SHIPPED bundle — mirrors deploy.yml /
          # the Android release lane so the App Store app has Google sign-in, the
          # registry/OAuth proxy, AI document extraction, and operational alerting
          # all wired. The official-build guard in vite.config.ts requires both
          # webhooks once VITE_BUILD_SHA is set.
          VITE_REGISTRY_API_URL: ${{ secrets.REGISTRY_API_URL }}
          VITE_REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VITE_GOOGLE_PROJECT_NUMBER: ${{ secrets.GOOGLE_PROJECT_NUMBER }}
          # Explicit on/off switch for the invite gate (repo VARIABLE, not a secret, so
          # its value is visible/editable in the UI). Only "true" arms the gate; the
          # hashes secret below stays populated but inert while this is off.
          VITE_INVITE_GATE: ${{ vars.INVITE_GATE }}
          VITE_INVITE_BEAN_HASHES: ${{ secrets.INVITE_BEAN_HASHES }}
          VITE_INVITE_WEBHOOK_URL: ${{ secrets.INVITE_WEBHOOK_URL }}
          # REVIEW-DEMO: (TEMPORARY) store-review demo bypass — a code-gated demo
          # family that needs no Google sign-in, because reviewers cannot get past
          # Google's risk-based verification challenges. Deliberately set ONLY on the
          # two mobile RELEASE lanes: never on deploy.yml (a negative assertion in
          # workflowEnvParity.test.ts enforces that the web bundle never carries it)
          # and never on the debug lanes (dev builds use .env.local).
          #
          # All three are repo VARIABLES, so their values are visible and editable in
          # the UI. The hash is deliberately NOT a secret: it is a one-way digest that
          # ships in the client bundle regardless, so the repo setting is not where the
          # exposure lives — the PLAINTEXT code is the thing that stays out of the repo.
          # EXPIRES is parsed as UTC MIDNIGHT, i.e. the first DEAD instant — set it to the day
          # AFTER the last day the demo should work. Unset = permanently disarmed.
          # Remove all three when demo mode is retired (see
          # docs/runbooks/native-store-submission.md).
          VITE_REVIEW_DEMO: ${{ vars.REVIEW_DEMO }}
          VITE_REVIEW_DEMO_CODE_HASH: ${{ vars.REVIEW_DEMO_CODE_HASH }}
          VITE_REVIEW_DEMO_EXPIRES: ${{ vars.REVIEW_DEMO_EXPIRES }}
          VITE_CONTACT_WEBHOOK_URL: ${{ secrets.CONTACT_WEBHOOK_URL }}
          VITE_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VITE_BEANIES_ERROR_WEBHOOK_URL: ${{ vars.BEANIES_ERROR_WEBHOOK_URL }}
          # #45 in-app feedback/NPS. VARIABLE, not a secret (it ships in the
          # client bundle anyway). MUST be here as well as in deploy.yml: the
          # native app has its own build step, and omitting it made every
          # app-submitted feedback a silent no-op from 2026-07-09 to 2026-08-10.
          VITE_FEEDBACK_WEBHOOK_URL: ${{ vars.FEEDBACK_WEBHOOK_URL }}
          VITE_BEANIES_LOG_INGEST_URL: ${{ vars.BEANIES_LOG_INGEST_URL }}
          VITE_BEANIES_LOG_INGEST_API_KEY: ${{ secrets.BEANIES_LOG_INGEST_API_KEY }}
          VITE_AI_EXTRACT_URL: ${{ vars.AI_EXTRACT_URL }}
          VITE_AI_EXTRACT_API_KEY: ${{ secrets.AI_EXTRACT_API_KEY }}
          # Recipe content fetcher (#72). On EVERY lane: the parity test only enforces the
          # two release lanes, so the debug lanes must be kept in step by hand or a native
          # debug build silently loses the ability to capture a recipe from a link.
          VITE_CONTENT_FETCH_URL: ${{ vars.CONTENT_FETCH_URL }}
          VITE_CONTENT_FETCH_API_KEY: ${{ secrets.CONTENT_FETCH_API_KEY }}
          VITE_PLAUSIBLE_DOMAIN: jvjpzIr6FM9tDKaS1gZaK
          VITE_BUILD_SHA: ${{ github.sha }}

      # A .swift file in ios/App/App/ is NOT compiled just because it is committed — the
      # App group lists its children explicitly and nothing here regenerates the project.
      # BiometricKeystorePlugin.swift was in exactly that state for months (#74), shipping a
      # feature that could not run. Fail before the archive rather than after the release.
      - name: Check every iOS Swift source is in Compile Sources
        run: node scripts/check-ios-sources.mjs

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Build + ship (Fastlane)
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Monotonic build number from the run; marketing version tracks
          # APP_VERSION (derived above, R-suffix stripped).
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ env.STORE_VERSION }}
          # The `release` lane strips the `appstore-` prefix to resolve the release
          # mode; the `beta` lane ignores it.
          IOS_DESTINATION: ${{ inputs.destination }}
          # Deliberately opt-IN. The check exists because three builds shipped unable to
          # share and nothing on the path noticed; defaulting it off would recreate that.
          SKIP_ENTITLEMENT_CHECK: ${{ inputs.skip_entitlement_check }}
          # The App Store "What's New" note. Required by the `release` lane for any
          # appstore-* destination (it fails loud if empty); unused by `beta`.
          WHATS_NEW: ${{ inputs.whats_new }}
          # App Store promotional text (optional, ≤170 chars). The `release` lane
          # refreshes it when set and leaves the current value untouched when empty;
          # unused by `beta`. No review needed — it can change independent of a build.
          PROMOTIONAL_TEXT: ${{ inputs.promotional_text }}
        run: |
          gem install fastlane --no-document
          # Routing rule (kept legible so control flow doesn't hide in the expression):
          #   any `appstore-*` destination → `release` (App Store submit)
          #   `testflight`                 → `beta`    (TestFlight upload)
          fastlane ${{ startsWith(inputs.destination, 'appstore') && 'release' || 'beta' }}
