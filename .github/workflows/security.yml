name: Security Scanning

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'tasks/**'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'tasks/**'
      - 'LICENSE'
      - '.claude/**'
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate audit report
        run: |
          npm audit --json > audit-report.json || true
          echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          npm audit || true

  security-linting:
    name: Security Code Scanning (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security ESLint checks
        run: npm run security:lint
        continue-on-error: true

      - name: Run full security check
        run: npm run security:full

  secrets-scanning:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets in code
        run: |
          npx eslint . --config eslint.security.config.js --rule 'no-secrets/no-secrets: error'
        continue-on-error: false

  license-audit:
    # Diff-free license audit over the full production dependency tree.
    # Fires on push (including direct-to-main) + PRs + the daily cron + manual
    # dispatch — i.e. every code path that lands on prod. Sister job
    # `dependency-review` (below, PR-only) covers diffed PRs from outside the
    # normal develop-on-main workflow; this one closes the main-push gap.
    #
    # Allowlist policy: standard permissive licenses only (MIT family + a few
    # commonly-permissive extras). Anything outside this list — copyleft (GPL,
    # AGPL, LGPL), source-available (BUSL, SSPL, Commons Clause), custom
    # non-commercial, or missing — fails the job. To allow a new license,
    # add it explicitly here (not via a config file) so the policy change is
    # auditable in version control.
    name: License Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency licenses
        run: |
          npx license-checker \
            --production \
            --excludePrivatePackages \
            --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;CC-BY-4.0;Unlicense;BlueOak-1.0.0;Python-2.0'

      - name: Write license summary
        if: always()
        run: |
          echo "## License Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Production dependency license breakdown:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx license-checker --production --excludePrivatePackages --summary >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'

  dependency-review:
    name: Dependency Review (PR Only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, security-linting, secrets-scanning, license-audit]
    if: always()

    steps:
      - name: Security Check Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Audit: ${{ needs.dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Linting: ${{ needs.security-linting.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets Scanning: ${{ needs.secrets-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- License Audit: ${{ needs.license-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review and fix any HIGH or CRITICAL vulnerabilities immediately" >> $GITHUB_STEP_SUMMARY
          echo "2. Update dependencies regularly to patch security issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Never commit secrets, API keys, or passwords to the repository" >> $GITHUB_STEP_SUMMARY
          echo "4. Use environment variables for sensitive configuration" >> $GITHUB_STEP_SUMMARY
