name: Translation Sync

on:
  schedule:
    # Daily at 3 AM UTC (offset from 2 AM security scan)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-sync
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-southeast-1

jobs:
  translate:
    name: Update Translations
    runs-on: ubuntu-latest

    # Retained for visibility in the Actions UI / API even though no downstream
    # job consumes it (the prod-deploy job that did was removed 2026-08-10).
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run translation update
        run: node scripts/updateTranslations.mjs --all

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet public/translations/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Translation changes detected:"
            git diff --stat public/translations/
          fi

      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git add public/translations/*.json
          # NO `[skip ci]`. It skips EVERY workflow for this push, including
          # main-ci and security — and deploy.yml gates on a green CI run for the
          # exact SHA it deploys, so a `[skip ci]` bot commit leaves `main`
          # un-deployable until someone dispatches CI by hand. That happened on
          # 2026-08-10. Translations are shipped app content; validating them is
          # not waste.
          git commit -m "chore(i18n): auto-update translations"
          git push

      - name: Note that a deploy is pending
        if: steps.check.outputs.has_changes == 'true'
        run: |
          {
            echo "### Translations updated"
            echo ""
            echo "New translations are committed to \`main\` but **not live**."
            echo "They ship on the next manual run of **Deploy beanies PROD** (\`deploy.yml\`)."
          } >> "$GITHUB_STEP_SUMMARY"

# NOTE (2026-08-10): a `Deploy to PROD` job used to live here. It built with a
# "deliberately reduced subset" of env vars — no VITE_BUILD_SHA, no Slack
# webhooks, no analytics, no AI-extract — and then ran
# `aws s3 sync dist/ --delete` over the production bucket.
#
# The effect was that every translation change silently replaced the live bundle
# with one that had error reporting, new-family pings, feedback delivery and
# analytics all switched off, undoing whatever the last proper deploy shipped. It
# did exactly that on 2026-08-10 and went unnoticed for hours.
#
# `deploy.yml` ("Deploy beanies PROD") is the ONLY sanctioned path to production:
# it injects the full env and gates on a green CI + Security run for the exact
# SHA. Translations now ride the next deploy of that workflow.
#
# This workflow deliberately does NOT dispatch deploy.yml either — production
# deploys are manual by project rule (see CLAUDE.md), and a scheduled job that
# ships to prod on its own is the same class of surprise in a nicer wrapper.
