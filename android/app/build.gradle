apply plugin: 'com.android.application'

// Release signing is configured ONLY when the keystore is supplied via env (the
// manual release-AAB CI lane — ADR-029 A6). When absent (every debug build and
// local dev), neither the signingConfig nor the release signingConfig binding is
// created, so `assembleDebug` and Gradle evaluation are completely unaffected.
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

// Committed stable debug keystore → a FIXED debug signing fingerprint so the
// debug APK's App Link can be verified (native Google sign-in round-trip;
// ADR-029). Debug keys are not sensitive (standard public creds).
def debugKeystoreFile = file("beanies-debug.keystore")

android {
    namespace = "family.beanies.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "family.beanies.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI is the source of truth: the release lane sets ANDROID_VERSION_CODE
        // (monotonic run number) and ANDROID_VERSION_NAME (derived from APP_VERSION
        // via scripts/derive-store-version.mjs). The literal fallbacks below apply
        // only to local dev builds.
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName(System.getenv("ANDROID_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Sign debug builds with the committed stable keystore so the App
            // Link fingerprint is fixed. Falls back to the default per-machine
            // debug key when the file is absent (e.g. a fresh checkout mid-edit).
            if (debugKeystoreFile.exists()) {
                storeFile debugKeystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    if (releaseKeystorePath) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed only when the keystore is supplied via env (release lane);
            // otherwise left unsigned so debug/local builds are unaffected.
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WebAuthn (passkey / biometric login) inside the WebView, via
    // WebSettingsCompat.setWebAuthenticationSupport — Credential Manager in
    // WebView. ALL THREE are required per the Android docs: webkit provides the
    // WebView↔WebAuthn API surface, while credentials + credentials-play-services-auth
    // are the Credential Manager runtime the bridge actually talks to. Without the
    // latter two the WebView throws NotReadableError ("An unknown error occurred
    // while talking to the credential manager"). Versions are the documented
    // WebView combo. See ADR-029.
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "androidx.credentials:credentials:1.6.0-beta02"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0-beta02"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
