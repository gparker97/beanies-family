apply plugin: 'com.android.application'

// Release signing is configured ONLY when the keystore is supplied via env (the
// manual release-AAB CI lane — ADR-029 A6). When absent (every debug build and
// local dev), neither the signingConfig nor the release signingConfig binding is
// created, so `assembleDebug` and Gradle evaluation are completely unaffected.
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

// Committed stable debug keystore → a FIXED debug signing fingerprint (ADR-029).
// ⚠️ Its certificate is DELIBERATELY ABSENT from the production
// `.well-known/assetlinks.json` (removed 2026-10-03, data-layer audit): the key is
// public, so listing it would let anyone sign an APK that Android trusts for
// beanies.family App Links (magic-link and OAuth returns). Debug builds therefore
// do NOT verify App Links; test those on a release-signed build.
def debugKeystoreFile = file("beanies-debug.keystore")

android {
    namespace = "family.beanies.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "family.beanies.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI is the source of truth: the release lane sets ANDROID_VERSION_CODE
        // (monotonic run number) and ANDROID_VERSION_NAME (derived from APP_VERSION
        // via scripts/derive-store-version.mjs). The literal fallbacks below apply
        // only to local dev builds.
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName(System.getenv("ANDROID_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Sign debug builds with the committed stable keystore so the App
            // Link fingerprint is fixed. Falls back to the default per-machine
            // debug key when the file is absent (e.g. a fresh checkout mid-edit).
            if (debugKeystoreFile.exists()) {
                storeFile debugKeystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    if (releaseKeystorePath) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed only when the keystore is supplied via env (release lane);
            // otherwise left unsigned so debug/local builds are unaffected.
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // #52 native biometric unlock: BiometricPrompt + AndroidKeyStore CryptoObject
    // (BiometricKeystorePlugin.java). Replaces the retired WebView-WebAuthn attempt —
    // the androidx.webkit + androidx.credentials* deps that backed that dead-end path
    // were removed with it (ADR-029, 2026-07-14).
    implementation "androidx.biometric:biometric:1.1.0"
    // Play install referrer: campaign attribution for native installs (InstallReferrerPlugin.java).
    implementation "com.android.installreferrer:installreferrer:$installReferrerVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
